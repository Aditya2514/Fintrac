<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="aiBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadowAi" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1100" height="620" rx="12" fill="url(#aiBg)"/>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="1100" height="54" fill="#1e293b" opacity="0.8"/>
  <circle cx="28" cy="27" r="6" fill="#ef4444"/>
  <circle cx="46" cy="27" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="27" r="6" fill="#10b981"/>
  <text x="95" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="1">FINTRAC</text>

  <!-- Title & Context Pill -->
  <g transform="translate(40, 80)">
    <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">AI Financial Advisor</text>
    <text x="0" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Powered by Google Gemini 2.5 Flash REST API with live context sync</text>

    <!-- Context pill -->
    <rect x="750" y="0" width="270" height="40" rx="20" fill="url(#geminiGrad)" filter="url(#shadowAi)"/>
    <text x="770" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">✦ GEMINI 2.5 CONTEXT SYNC ACTIVE</text>
  </g>

  <!-- Main Chat Container Card -->
  <g transform="translate(40, 145)" filter="url(#shadowAi)">
    <rect width="1020" height="440" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Live Context Sidebar Banner -->
    <g transform="translate(20, 20)">
      <rect width="260" height="400" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">⚡ LIVE INGESTED DATA</text>
      
      <line x1="16" y1="38" x2="244" y2="38" stroke="#334155" stroke-width="1"/>

      <text x="16" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Net Cash Flow:</text>
      <text x="16" y="76" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">+$20,030.00</text>

      <text x="16" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Gross Income:</text>
      <text x="16" y="118" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">$14,250.00</text>

      <text x="16" y="144" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Gross Expenses:</text>
      <text x="16" y="160" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">$4,860.00</text>

      <text x="16" y="186" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Emergency Savings:</text>
      <text x="16" y="202" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">$9,390.00</text>

      <text x="16" y="228" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Budget Limits Set:</text>
      <text x="16" y="244" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4 Active Categories</text>

      <rect x="16" y="280" width="228" height="100" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="26" y="300" fill="#818cf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">SYSTEM INSTRUCTION</text>
      <text x="26" y="318" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">"You are an elite financial advisor. Analyze client transactions and evaluate cash burn efficiency."</text>
    </g>

    <!-- Chat Conversation Stream -->
    <g transform="translate(300, 20)">

      <!-- Model Message 1 -->
      <g transform="translate(0, 0)">
        <circle cx="18" cy="18" r="16" fill="url(#geminiGrad)"/>
        <text x="11" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">✨</text>

        <rect x="44" y="0" width="650" height="60" rx="10" fill="url(#aiBubble)" stroke="#334155" stroke-width="1"/>
        <text x="60" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AI Advisor:</text>
        <text x="60" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Hello! I have direct access to your live balance, income streams, expenses, and budget limits. What would you like to discuss?</text>
      </g>

      <!-- User Message 1 -->
      <g transform="translate(0, 75)">
        <circle cx="678" cy="18" r="16" fill="#3b82f6"/>
        <text x="670" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">YOU</text>

        <rect x="110" y="0" width="540" height="50" rx="10" fill="url(#userBubble)"/>
        <text x="126" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">User Prompt:</text>
        <text x="126" y="38" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Based on my spending this month, can I increase my monthly emergency savings allocation?</text>
      </g>

      <!-- Model Message 2 (Detailed Markdown Response) -->
      <g transform="translate(0, 140)">
        <circle cx="18" cy="18" r="16" fill="url(#geminiGrad)"/>
        <text x="11" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">✨</text>

        <rect x="44" y="0" width="650" height="190" rx="10" fill="url(#aiBubble)" stroke="#6366f1" stroke-width="1.5"/>
        <text x="60" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AI Advisor Analysis:</text>

        <text x="60" y="48" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✅ Absolutely. You are in a remarkably strong cash surplus position.</text>

        <text x="60" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">• Total Net Cash Flow: $20,030 surplus across tracked cycles.</text>
        <text x="60" y="88" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">• Current Savings Rate: 65.8% of your gross income ($14,250).</text>
        <text x="60" y="106" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5">• Opportunity Leak: Food &amp; Dining is currently $80 over budget limit.</text>

        <rect x="60" y="122" width="618" height="52" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
        <text x="72" y="140" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">💡 Actionable Recommendation:</text>
        <text x="72" y="158" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="9.5">Safely increase monthly savings transfer from $1,200 → $2,500. You will reach your $25,000 emergency benchmark in 6.2 months.</text>
      </g>

      <!-- Input Form Bar -->
      <g transform="translate(0, 350)">
        <rect x="44" y="0" width="550" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="60" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Ask Gemini AI anything about your budget, taxes, or savings strategy...</text>

        <rect x="604" y="0" width="90" height="42" rx="8" fill="url(#userBubble)"/>
        <text x="630" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Send ➔</text>
      </g>
    </g>
  </g>
</svg>
