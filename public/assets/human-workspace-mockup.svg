<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Dark Environment Gradients -->
    <radialGradient id="deskGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="screenBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Screen UI Gradients -->
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="successGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="expenseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="chartLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Desk Scene -->
  <rect width="1200" height="675" fill="url(#deskGlow)"/>

  <!-- Minimalist Desk Elements -->
  <!-- Coffee Mug -->
  <g transform="translate(140, 120)">
    <ellipse cx="30" cy="30" rx="28" ry="28" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <ellipse cx="30" cy="30" rx="22" ry="22" fill="#3b2314"/>
    <ellipse cx="30" cy="30" rx="16" ry="16" fill="#4a2e1b"/>
    <path d="M 56 18 C 68 18, 68 42, 56 42" stroke="#334155" stroke-width="4" fill="none"/>
  </g>

  <!-- Notebook & Pen -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="130" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    <line x1="25" y1="0" x2="25" y2="180" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="45" y1="40" x2="110" y2="40" stroke="#475569" stroke-width="2"/>
    <line x1="45" y1="65" x2="100" y2="65" stroke="#475569" stroke-width="2"/>
    <line x1="45" y1="90" x2="105" y2="90" stroke="#475569" stroke-width="2"/>
    <!-- Stylus Pen -->
    <rect x="145" y="20" width="8" height="150" rx="4" fill="#94a3b8" transform="rotate(12 145 20)"/>
  </g>

  <!-- Main Workstation Laptop (Human Overhead Angle) -->
  <g transform="translate(300, 40)" filter="url(#dropShadow)">
    <!-- Screen Bezel Outer -->
    <rect x="0" y="0" width="600" height="400" rx="16" fill="url(#screenBezel)" stroke="#475569" stroke-width="2"/>
    <!-- Screen Glass Frame -->
    <rect x="12" y="12" width="576" height="376" rx="8" fill="url(#uiBg)"/>

    <!-- Web App Header -->
    <rect x="12" y="12" width="576" height="40" fill="#161b22" stroke-bottom="#30363d"/>
    <circle cx="32" cy="32" r="5" fill="#ef4444"/>
    <circle cx="48" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="64" cy="32" r="5" fill="#10b981"/>
    
    <!-- URL Bar & Logo -->
    <rect x="90" y="24" width="220" height="16" rx="8" fill="#21262d"/>
    <text x="102" y="36" fill="#8b949e" font-family="system-ui, sans-serif" font-size="9" font-weight="500">https://fintrac.app/dashboard</text>
    
    <!-- Fintrac Brand Pill -->
    <rect x="460" y="22" width="110" height="20" rx="10" fill="url(#primaryGlow)"/>
    <text x="478" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">✦ Gemini AI Active</text>

    <!-- Fintrac Web App Dashboard Content -->
    <g transform="translate(24, 64)">
      <!-- Top Title & Net Worth Banner -->
      <text x="0" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Financial Command Center</text>
      <text x="0" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Real-time wealth tracking & AI portfolio intelligence</text>

      <!-- Metric Cards Row -->
      <!-- Total Net Worth -->
      <g transform="translate(0, 48)">
        <rect width="168" height="70" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">NET CASH FLOW</text>
        <text x="12" y="44" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="18" font-weight="800">+$48,250.00</text>
        <text x="12" y="60" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="600">↑ +14.2% vs last month</text>
      </g>

      <!-- Income -->
      <g transform="translate(180, 48)">
        <rect width="168" height="70" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">TOTAL MONTHLY INCOME</text>
        <text x="12" y="44" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="800">$12,450.00</text>
        <rect x="120" y="48" width="36" height="12" rx="4" fill="#065f46"/>
        <text x="124" y="57" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="700">+8.5%</text>
      </g>

      <!-- Expenses -->
      <g transform="translate(360, 48)">
        <rect width="168" height="70" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">TOTAL MONTHLY EXPENSE</text>
        <text x="12" y="44" fill="#f87171" font-family="system-ui, sans-serif" font-size="18" font-weight="800">$4,120.50</text>
        <text x="12" y="60" fill="#f87171" font-family="system-ui, sans-serif" font-size="8" font-weight="600">↓ 33% budget consumed</text>
      </g>

      <!-- Analytics Main Section -->
      <!-- Income vs Expense Bar Chart Card -->
      <g transform="translate(0, 132)">
        <rect width="330" height="150" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Cash Flow Trajectory (6 Months)</text>

        <!-- Chart Grid Lines -->
        <line x1="12" y1="40" x2="318" y2="40" stroke="#1e293b" stroke-width="1"/>
        <line x1="12" y1="70" x2="318" y2="70" stroke="#1e293b" stroke-width="1"/>
        <line x1="12" y1="100" x2="318" y2="100" stroke="#1e293b" stroke-width="1"/>
        <line x1="12" y1="130" x2="318" y2="130" stroke="#334155" stroke-width="1"/>

        <!-- Bars -->
        <!-- Jan -->
        <rect x="30" y="60" width="14" height="70" rx="3" fill="#10b981"/>
        <rect x="48" y="90" width="14" height="40" rx="3" fill="#f43f5e"/>
        <!-- Feb -->
        <rect x="80" y="50" width="14" height="80" rx="3" fill="#10b981"/>
        <rect x="98" y="85" width="14" height="45" rx="3" fill="#f43f5e"/>
        <!-- Mar -->
        <rect x="130" y="45" width="14" height="85" rx="3" fill="#10b981"/>
        <rect x="148" y="95" width="14" height="35" rx="3" fill="#f43f5e"/>
        <!-- Apr -->
        <rect x="180" y="35" width="14" height="95" rx="3" fill="#10b981"/>
        <rect x="198" y="80" width="14" height="50" rx="3" fill="#f43f5e"/>
        <!-- May -->
        <rect x="230" y="40" width="14" height="90" rx="3" fill="#10b981"/>
        <rect x="248" y="88" width="14" height="42" rx="3" fill="#f43f5e"/>
        <!-- Jun -->
        <rect x="280" y="30" width="14" height="100" rx="3" fill="#10b981"/>
        <rect x="298" y="92" width="14" height="38" rx="3" fill="#f43f5e"/>
      </g>

      <!-- Gemini AI Advisor Side Card -->
      <g transform="translate(342, 132)">
        <rect width="186" height="150" rx="8" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.5"/>
        <rect x="0" y="0" width="186" height="28" rx="8" fill="url(#primaryGlow)"/>
        <text x="10" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">🤖 GEMINI AI ADVISOR</text>
        
        <text x="10" y="44" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">"Your savings rate is currently 67%."</text>
        <text x="10" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Recommendation: Reallocate $800 from surplus checking into index funds to accelerate your retirement goal by 1.4 years.</text>
        
        <rect x="10" y="85" width="166" height="24" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
        <text x="16" y="100" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="8">💬 "Analyze my investment risk..."</text>

        <rect x="10" y="116" width="166" height="22" rx="4" fill="url(#successGlow)"/>
        <text x="50" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">Open AI Chat →</text>
      </g>
    </g>

    <!-- Laptop Lower Body & Keyboard (Human Perspective Bottom) -->
    <path d="M -40 400 L 640 400 L 680 435 L -80 435 Z" fill="url(#laptopBody)" stroke="#334155" stroke-width="1.5"/>
    <!-- Trackpad -->
    <rect x="230" y="406" width="140" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Human Hands (Authentic Overhead Perspective) -->
  <!-- Left Hand resting near trackpad -->
  <g transform="translate(360, 450)" opacity="0.9">
    <!-- Arm/Wrist -->
    <path d="M -120 220 Q -40 120 40 40 Q 60 20 80 30 Q 100 45 70 85 L 10 220 Z" fill="#d97706" opacity="0.25"/> <!-- Sleeve -->
    <!-- Hand Palm & Fingers resting -->
    <path d="M 40 40 Q 60 10 90 20 Q 110 30 100 55 L 70 100 Q 50 110 30 80 Z" fill="#e5c09b"/>
    <!-- Fingers -->
    <path d="M 85 20 Q 115 -5 125 15 Q 115 30 95 30 Z" fill="#e0b38c"/>
    <path d="M 95 28 Q 125 10 135 30 Q 125 42 102 40 Z" fill="#d9a87e"/>
    <path d="M 100 40 Q 125 30 130 50 Q 118 60 98 52 Z" fill="#d49e72"/>
  </g>

  <!-- Right Hand typing on keyboard / mouse right side -->
  <g transform="translate(740, 430)" opacity="0.9">
    <!-- Arm Sleeve -->
    <path d="M 180 240 Q 100 130 20 50 Q 0 30 -15 45 Q -25 65 5 110 L 90 240 Z" fill="#4338ca" opacity="0.3"/>
    <!-- Hand & Fingers typing -->
    <path d="M 20 50 Q -10 20 -30 35 Q -45 55 -20 80 L 10 110 Q 30 120 40 85 Z" fill="#e5c09b"/>
    <!-- Index finger extended -->
    <path d="M -25 30 Q -55 5 -60 22 Q -50 40 -30 42 Z" fill="#e0b38c"/>
    <path d="M -30 42 Q -55 25 -58 42 Q -45 55 -25 55 Z" fill="#d9a87e"/>
  </g>

  <!-- Modern Overlay Badge -->
  <g transform="translate(50, 40)" filter="url(#glowEffect)">
    <rect width="210" height="48" rx="24" fill="#0f172a" stroke="url(#primaryGlow)" stroke-width="2"/>
    <circle cx="28" cy="24" r="14" fill="url(#primaryGlow)"/>
    <text x="24" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900">⚡</text>
    <text x="50" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">FINTRAC V2.5</text>
    <text x="50" y="36" fill="#818cf8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Smart Financial Intelligence</text>
  </g>
</svg>
